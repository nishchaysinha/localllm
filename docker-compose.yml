services:
  llama:
    build: .
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      LLAMA_ARG_MODEL: /models/gemma-4-26B-A4B-it-UD-IQ4_NL.gguf
      LLAMA_ARG_MMPROJ: /models/mmproj-F16.gguf
      LLAMA_ARG_N_GPU_LAYERS: "999"
      # LLAMA_ARG_CPU_MOE: "1"
      LLAMA_ARG_NO_MMAP: "1"
      LLAMA_ARG_MLOCK: "1"
      LLAMA_ARG_CACHE_TYPE_K: turbo4
      LLAMA_ARG_CACHE_TYPE_V: turbo3
      LLAMA_ARG_CTX_SIZE: "65536"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8000"
      LLAMA_API_KEY: ${VLLM_API_KEY}
      NVIDIA_VISIBLE_DEVICES: all
    ulimits:
      memlock: -1
    ipc: host
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      - TUNNEL_URL=http://llama:8000
    depends_on:
      - llama
    restart: unless-stopped

